# /etc/nginx/sites-available/filament.home.obrys.cz
#
# Reverse proxy for the Filament application.
# Place this file in /etc/nginx/sites-available/ and symlink it from
# /etc/nginx/sites-enabled/, then:  nginx -t && systemctl reload nginx

# Map the Connection/Upgrade headers so WebSocket upgrade works correctly
# (and is also a no-op for normal HTTP requests). Must live in the http {}
# scope. If you already declare this elsewhere (e.g. conf.d/), delete it here.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- HTTP : redirect everything to HTTPS ----------------------------------
server {
    listen 192.168.88.243:80;
    listen 192.168.89.243:80;
    listen [fd89::243]:80;
    server_name filament.home.obrys.cz;
    return 301 https://$host$request_uri;
}

# --- HTTPS : reverse proxy to the services VM -----------------------------
server {
    listen 192.168.88.243:443 ssl;
    listen 192.168.89.243:443 ssl;
    listen [fd89::243]:443 ssl;
    http2 on;

    server_name filament.home.obrys.cz;

    ssl_certificate     /etc/letsencrypt/live/filament.home.obrys.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/filament.home.obrys.cz/privkey.pem;

    # Modern TLS profile (Mozilla "intermediate")
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Reasonable upload size for label PDFs and JSON payloads.
    client_max_body_size 8m;

    # Compress text responses (PDFs and images are already compressed).
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_min_length 1024;
    gzip_types      text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    server_tokens off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                              always;
    add_header X-Frame-Options           "SAMEORIGIN"                           always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;

    access_log /var/log/nginx/filament.access.log;
    error_log  /var/log/nginx/filament.error.log;

    # NOTE: proxy_pass uses a literal hostname (not a $variable). nginx
    # resolves it once at startup/reload. If web.lan's IP ever changes,
    # `systemctl reload nginx` picks it up. Using a variable would require
    # an explicit `resolver` directive for runtime DNS.

    # ----- WebSocket endpoint (live change notifications) -------------------
    # Filament's API exposes /ws/changes — this block must come before "/".
    location /ws/ {
        proxy_pass             http://192.168.88.241:8081;

        proxy_http_version     1.1;
        proxy_set_header       Upgrade           $http_upgrade;
        proxy_set_header       Connection        $connection_upgrade;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;

        # Don't buffer — push events to the client immediately.
        proxy_buffering        off;
        proxy_cache            off;

        # Long-lived connections: 1 h idle timeout. The API sends a 20 s
        # application-level ping, so this is mostly a safety net.
        proxy_read_timeout     3600s;
        proxy_send_timeout     3600s;
    }

    # ----- Everything else (SPA + REST API) --------------------------------
    location / {
        proxy_pass             http://192.168.88.241:8081;

        proxy_http_version     1.1;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;

        # Keep connections to the upstream alive.
        proxy_set_header       Connection        "";

        proxy_connect_timeout  10s;
        proxy_read_timeout     60s;
        proxy_send_timeout     60s;
    }
}
