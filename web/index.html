<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Filament</title>
    <meta name="description" content="Self-hosted filament &amp; spool management for small 3D-print farms." />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0c0f16" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eef0f5" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-title" content="Filament" />
    <meta name="color-scheme" content="dark light" />

    <script>
      // Apply the stored theme before first paint so a reload never flashes the wrong palette.
      (function () {
        try {
          var t = localStorage.getItem('filament.theme')
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
        } catch (e) { /* storage may be unavailable */ }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
