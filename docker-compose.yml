services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpw
      MARIADB_DATABASE: filament
      MARIADB_USER: filament
      MARIADB_PASSWORD: filament
    volumes:
      - filament-db:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/Filament.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Filament: "Server=db;Port=3306;Database=filament;User=filament;Password=filament"
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "8080:8080"
    # Tuned for 256-512 MB RAM targets:
    deploy:
      resources:
        limits:
          memory: 384M

  web:
    build:
      context: ./web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:8080"

volumes:
  filament-db:
